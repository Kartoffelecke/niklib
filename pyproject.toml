[project]
name = "niklib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Niklas Endres", email = "niklas.endres@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["tifffile", "typer", "scikit-image","readlif"]

[project.optional-dependencies]
napari = ["napari[all]"]

[project.scripts]
niklib = "niklib.cli:app"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
